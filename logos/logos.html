<!DOCTYPE html>

<head>

<style>

:root{
    --bg: #d8d3c2;
    --text: #3b3a35;
    --muted: #6b685d;
    --line: rgba(50,50,45,0.12);
    --dark: #2d2c28;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: var(--bg);
    color: var(--text);
    font-family: "Montserrat", sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    letter-spacing:0.08em;
    position:relative;
}

/* PAPER TEXTURE */

body::before{
    content:"";
    position:fixed;
    inset:0;
    opacity:0.08;
    pointer-events:none;

    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.04) 0px,
            rgba(0,0,0,0.04) 1px,
            transparent 1px,
            transparent 3px
        ),
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,0.02) 0px,
            rgba(0,0,0,0.02) 1px,
            transparent 1px,
            transparent 4px
        );
}

/* TECHNICAL OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.diagonal{
    position:absolute;
    width:200%;
    height:1px;
    background:var(--line);
    transform:rotate(45deg);
}

.d1{ top:10%; left:-40%; }
.d2{ top:28%; left:-30%; }
.d3{ top:52%; left:-50%; }
.d4{ top:72%; left:-35%; }

.circle{
    position:absolute;
    border:1px solid var(--line);
    border-radius:50%;
}

.c1{
    width:700px;
    height:700px;
    right:-300px;
    bottom:-250px;
}

.c2{
    width:500px;
    height:500px;
    left:-200px;
    top:-120px;
}

/* FRAME */

.frame{
    position:fixed;
    inset:20px;
    border:1px solid rgba(20,20,20,0.55);
    pointer-events:none;
}

.frame::before,
.frame::after{
    content:"";
    position:absolute;
    left:0;
    width:100%;
    height:10px;

    background-image:
    radial-gradient(circle, rgba(30,30,30,0.6) 1px, transparent 2px);

    background-size:22px 10px;
}

.frame::before{
    top:-12px;
}

.frame::after{
    bottom:-12px;
}

/* MAIN */

main{
    width:min(1400px, calc(100% - 120px));
    margin:0 auto;
    padding-top:120px;
    padding-bottom:180px;
}

/* HERO */

.hero{
    margin-bottom:100px;
}

.hero-title{
    font-size:5rem;
    font-weight:200;
    letter-spacing:0.22em;
    line-height:1;
    margin-bottom:25px;
}

.hero-oneliner{
    font-size:1rem;
    color:var(--dark);
    margin-bottom:20px;
}

.hero-description{
    max-width:700px;
    color:var(--muted);
    line-height:2;
    font-size:0.9rem;
}

/* WORKS */

/* LOGO GRID — square images only, 2-5 per row depending on width */

.logo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:24px;
}

.logo-card{
    aspect-ratio:1 / 1;
    border:1px solid rgba(0,0,0,0.18);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    min-width:0;
}

.logo-card a{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-card img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
}

/* below this, auto-fit would drop to a single column — hold the floor at 2 */
@media(max-width:540px){
    .logo-grid{
        grid-template-columns:repeat(2, 1fr);
    }
}

/* BUTTONS */

.button-row{
    margin-top:40px;
    display:flex;
    gap:20px;
}

.ui-button{
    background:none;
    border:1px solid rgba(0,0,0,0.25);
    color:var(--text);

    padding:16px 38px;

    font-family:inherit;
    font-size:0.8rem;
    letter-spacing:0.15em;

    cursor:pointer;
    transition:0.25s;
}

.ui-button:hover{
    background:rgba(0,0,0,0.08);
}

/* FOOTER */

footer{
    width:min(1400px, calc(100% - 120px));
    margin:0 auto;

    padding-bottom:60px;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

.footer-left h2{
    font-size:1.4rem;
    font-weight:200;
    letter-spacing:0.2em;
    margin-bottom:12px;
}

.footer-left p{
    color:var(--muted);
    line-height:1.8;
    font-size:0.8rem;
}

.footer-right{
    display:flex;
    gap:60px;
}

.footer-block span{
    display:block;
    margin-bottom:10px;
    color:var(--muted);
    font-size:0.7rem;
}

.footer-block a,
.footer-block p{
    font-size:0.85rem;
    color:var(--text);
    text-decoration:none;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .hero-title{
        font-size:3rem;
    }
}

@media(max-width:700px){

    main,
    footer{
        width:calc(100% - 50px);
    }

    .hero-title{
        font-size:2.3rem;
    }

    .button-row{
        flex-direction:column;
    }

    footer{
        flex-direction:column;
        align-items:flex-start;
        gap:40px;
    }

    .footer-right{
        flex-direction:column;
        gap:25px;
    }
}

.top-logo{
    position:fixed;
    top:48px;
    right:60px;

    width:150px;
    height:150px;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:50;
}

.top-logo img{
    width:100%;
    height:100%;
    object-fit:contain;

    opacity:0.9;
}


/* RESPONSIVE */

@media(max-width:700px){

        top:35px;

        width:34px;
        height:34px;
    }

}

.ui-button{
    display:inline-flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;
}

.copy-email{
    cursor:pointer;
    transition:color 0.25s;
}

.copy-email:hover{
    color:var(--dark);
}

.copy-email.copied{
    color:#a87d2f;
}

</style>
</head>

<script>
function copyEmail(el){
    const email = el.dataset.email;

    function showCopied(){
        el.textContent = "Copied!";
        el.classList.add("copied");
        clearTimeout(el._copyTimeout);
        el._copyTimeout = setTimeout(() => {
            el.textContent = email;
            el.classList.remove("copied");
        }, 1500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(email).then(showCopied).catch(() => fallbackCopy(email, showCopied));
    } else {
        fallbackCopy(email, showCopied);
    }
}

function fallbackCopy(text, done){
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.appendChild(temp);
    temp.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(temp);
}

document.querySelectorAll(".copy-email").forEach(el => {
    el.addEventListener("click", () => copyEmail(el));
    el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " "){
            e.preventDefault();
            copyEmail(el);
        }
    });
});
</script>
