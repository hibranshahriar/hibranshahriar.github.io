<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recabulary | Hibran</title>
<style>
  :root{
    --ink:#151b19;
    --ink-soft:#1d2724;
    --paper:#efe6d2;
    --paper-shadow: rgba(24,18,8,.45);
    --text-dark:#2b2013;
    --text-muted:#6b6152;
    --text-on-dark:#cfc9b8;
    --text-on-dark-dim:#8b9089;
    --accent-correct:#5f8f6a;
    --accent-wrong:#b8503f;
    --accent-gold:#c99a3e;
    --hairline: rgba(43,32,19,.18);
    --hairline-dark: rgba(255,255,255,.1);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, var(--ink-soft) 0%, var(--ink) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-on-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 20px 60px;
  }

  header{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 8vh;
  }

  .brand{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.05rem;
    letter-spacing: .02em;
    color: var(--text-on-dark);
  }

  .score{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: .85rem;
    color: var(--text-on-dark-dim);
  }

  .tally{
    display:inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: .78rem;
    font-weight: 700;
    color: #fff;
  }
  .tally-correct{ background: var(--accent-correct); }
  .tally-wrong{ background: var(--accent-wrong); }

  main{
    width:100%;
    max-width: 480px;
  }

  .card{
    background: var(--paper);
    border-radius: 5px;
    padding: 40px 36px 32px;
    box-shadow: 0 20px 44px var(--paper-shadow);
  }

  .tag{
    margin: 0 0 10px;
    font-size: .78rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .word{
    margin: 0 0 30px;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    color: var(--text-dark);
    text-transform: capitalize;
    line-height: 1.15;
  }

  .options{
    list-style:none;
    margin:0;
    padding:0;
  }

  .options li + li{
    border-top: 1px solid var(--hairline);
  }

  .option{
    width:100%;
    display:flex;
    align-items:baseline;
    gap: 14px;
    background:none;
    border:none;
    text-align:left;
    padding: 14px 6px;
    font-size: 1.02rem;
    color: var(--text-dark);
    cursor:pointer;
    border-radius: 3px;
    transition: background .15s, color .15s;
  }
  .option:hover:not(:disabled){ background: rgba(43,32,19,.06); }
  .option:focus-visible{ outline: 2px solid var(--accent-gold); outline-offset: -2px; }
  .option:disabled{ cursor: default; }

  .option .letter{
    font-family: Georgia, serif;
    font-style: italic;
    color: var(--text-muted);
    flex-shrink:0;
  }

  .option.correct{ background: var(--accent-correct); color:#fff; }
  .option.correct .letter{ color: rgba(255,255,255,.75); }
  .option.wrong{ background: var(--accent-wrong); color:#fff; text-decoration: line-through; opacity:.9; }
  .option.wrong .letter{ color: rgba(255,255,255,.75); }

  .next-btn{
    display:block;
    margin: 26px 0 0;
    background: var(--accent-gold);
    color: var(--ink);
    border:none;
    font-size: .92rem;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 3px;
    cursor:pointer;
    transition: filter .15s;
  }
  .next-btn:hover, .next-btn:focus-visible{ filter: brightness(1.08); }

  .example{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .35s ease;
    overflow: hidden;
  }
  .example.is-visible{
    grid-template-rows: 1fr;
  }
  .example-text{
    min-height: 0;
    overflow: hidden;
    margin: 22px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--hairline);
    font-size: .95rem;
    line-height: 1.55;
    color: var(--text-muted);
    font-style: italic;
  }
  .example-text .label{
    font-style: normal;
    font-weight: 600;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .example-text strong{
    font-style: normal;
    font-weight: 600;
    color: #9c6f1f;
  }

  @media (max-width: 480px){
    .card{ padding: 32px 24px 26px; }
    header{ margin-bottom: 6vh; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <div class="scene">
    <header>
      <span class="brand">Recabulary | Wordsmart</span>
      <span class="score">Score <span class="tally tally-correct" id="correctTally">+0</span><span class="tally tally-wrong" id="wrongTally">-0</span></span>

    <main>
      <div class="card">
        <p class="tag" id="cardTag">Card 1 of 20</p>

        <ul class="options" id="options"></ul>
        <div class="example" id="exampleSentence"><p class="example-text" id="exampleText"></p></div>
        <button class="next-btn" id="nextBtn" hidden>Next card</button>
      </div>
    </main>
  </div>

{ word: "Profligate", meaning: "extravagantly wasteful and, usually, wildly immoral", example: "The fraternity members were a profligate bunch; they held allnight orgies on weeknights." },
{ word: "Profound", meaning: "deep (in several senses)", example: "Profound understanding is deep understanding." },
{ word: "Profuse", meaning: "flowing; extravagant", example: "When we gave Marian our house, our car, and all our clothes, her gratitude was profuse." },

{ word: "Proliferate", meaning: "to spread or grow rapidly", example: "Honeybees proliferated when we filled our yard with flowering plants." },
{ word: "Prolific", meaning: "abundantly productive; fruitful or fertile", example: "A prolific writer is a writer who writes a lot of books." },
{ word: "Promulgate", meaning: "to proclaim; to publicly or formally declare something", example: "The principal promulgated a new dress code over the loudspeaker system." },
{ word: "Propensity", meaning: "a natural inclination or tendency; a predilection", example: "Jessie has a propensity for saying stupid things: Every time she opens her mouth, something stupid comes out." },
{ word: "Propitious", meaning: "marked by favorable signs or conditions", example: "Rush hour is not a propitious time to drive into the city." },
{ word: "Proponent", meaning: "an advocate; a supporter of a position", example: "The proponents of a tax increase will probably not be reelected next fall." },
{ word: "Proprietary", meaning: "characteristic of an owner of property; constituting property", example: "George felt proprietary about the chocolatecookie recipe; he had invented it himself." },
{ word: "Propriety", meaning: "properness; good manners", example: "The old lady viewed the little girl's failure to curtsy as a flagrant breach of propriety." },
{ word: "Prosaic", meaning: "dull; unimaginative; like prose (as opposed to poetry)", example: "His description of the battle was so prosaic that it was hard for his listeners to believe that any of the soldiers had even been wounded." },
{ word: "Proscribe", meaning: "to outlaw; to prohibit", example: "Spitting on the sidewalk and shooting at road signs were both proscribed activities under the new administration." },
{ word: "Proselytize", meaning: "to convert (someone) from one religion or doctrine to another; to recruit converts to a religion or doctrine", example: "The former Methodist had been proselytized by a Lutheran deacon." },
{ word: "Protract", meaning: "to prolong", example: "The trial was so protracted that one of the jurors died of old age and another gave birth." },
{ word: "Provident", meaning: "preparing for the future; providing for the future; frugal", example: "We were provident with our limited food supplies, knowing that the winter ahead would be long and cold." },
{ word: "Provincial", meaning: "limited in outlook to one's own small corner of the world; narrow", example: "The farmers were provincial; they had no opinions about anything but the price of corn." },
{ word: "Provisional", meaning: "conditional; temporary; tentative", example: "Louis had been accepted as a provisional member of the club." },
{ word: "Proximity", meaning: "nearness", example: "I can't stand being in the proximity of a nuclear explosion." },
{ word: "Prudent", meaning: "careful; having foresight", example: "Joe is a prudent money manager." },
{ word: "Purported", meaning: "rumored; claimed", example: "The heiress is purported to have been kidnapped by adventurers." },
{ word: "Putative", meaning: "commonly accepted; supposed; reputed", example: "The putative reason for placing the monument downtown is that nobody had wanted it uptown." },
{ word: "Qualify", meaning: "to modify or restrict", example: "Susan qualified her praise of Judith by saying that her kind words applied only to Judith’s skillful cooking and not to her abhorrent personality." },
{ word: "Qualitative", meaning: "having to do with the quality or qualities of something (as opposed to the quantity)", example: "If a school achieves a qualitative improvement in enrollment, it means the school is being attended by better students." },
{ word: "Quantitative", meaning: "having to do with quantity", example: "If the school achieves a quantitative improvement, it means the school is being attended by more students." },
{ word: "Querulous", meaning: "complaining; grumbling; whining", example: "The exasperated mother finally managed to hush her querulous child." },
{ word: "Quixotic", meaning: "romantic or idealistic to a foolish or impractical degree", example: "For many years Mr. Morris had led a quixotic effort to repeal the federal income tax." },
{ word: "Ramification", meaning: "a consequence; a branching out", example: "The professor found a solution to the problem, but there are many ramifications; some experts are afraid that he has created more problems than he has solved." },
{ word: "Rancor", meaning: "bitter, longlasting ill will or resentment", example: "The mutual rancor felt by the two nations eventually led to war." },
{ word: "Rapacious", meaning: "greedy; plundering; avaricious", example: "Wall Street investment bankers are often accused of being rapacious, but they claim they are performing a valuable economic function." },
{ word: "Rebuke", meaning: "to criticize sharply", example: "We trembled as Mr. Solomon rebuked us for flipping over his car and taking off the tires." },
{ word: "Rebut", meaning: "to contradict; to argue in opposition to; to prove to be false", example: "They all thought I was crazy, but none of them could rebut my argument." },
{ word: "Recalcitrant", meaning: "stubbornly defiant of authority or control; disobedient", example: "The recalcitrant cancer continued to spread through the patient's body despite every therapy and treatment the doctors tried." },
{ word: "Recant", meaning: "to publicly take back and deny (something previously said or believed); to openly confess error", example: "The chagrined scientist recanted his theory that mice originated on the moon; it turned out that he had simply mixed up the results of two separate experiments." },
{ word: "Reciprocal", meaning: "mutual; shared; interchangeable", example: "The Rochester Club had a reciprocal arrangement with the Duluth Club." },
{ word: "Reclusive", meaning: "hermitlike; withdrawn from society", example: "The crazy millionaire led a reclusive existence, shutting himself up in his labyrinthine mansion and never setting foot in the outside world." },
{ word: "Recondite", meaning: "hard to understand; over one's head", example: "The philosopher's thesis was so recondite that I couldn't get past the first two sentences." },
{ word: "Recrimination", meaning: "a bitter counteraccusation, or the act of making a bitter counteraccusation", example: "Melissa was full of recrimination." },
{ word: "Redolent", meaning: "fragrant", example: "The air in autumn is redolent of wood smoke and fallen leaves." },
{ word: "Redundant", meaning: "unnecessarily repetitive; excessive; excessively wordy", example: "Eric had already bought paper plates, so our purchase of paper plates was redundant." },
{ word: "Refute", meaning: "to prove to be false; to disprove", example: "His expensive suit and imported shoes clearly refuted his claim that he was poor." },

{ word: "Relegate", meaning: "to banish; to send away", example: "The most junior of the junior executives was relegated to a tiny, windowless office that had once been a broom closet." },
{ word: "Relentless", meaning: "continuous; unstoppable", example: "The insatiable rabbit was relentless; it ate and ate until nothing was left in the botanical garden." },
{ word: "Relinquish", meaning: "to release or let go of; to surrender; to stop doing", example: "The hungry dog refused to relinquish the enormous beef bone that he had stolen from the butcher's shop." },
{ word: "Remonstrate", meaning: "to argue against; to protest; to raise objections", example: "My boss remonstrated with me for telling all the secretaries they could take off the rest of the week." },
{ word: "Renaissance", meaning: "a rebirth or revival", example: "The declining neighborhood underwent a renaissance when a group of investors bought several crumbling tenements and turned them into attractive apartment buildings." },
{ word: "Renounce", meaning: "to give up formally or resign; to disown; to have nothing to do with anymore", example: "Despite the pleadings and protestations of her parents, Deborah refused to renounce her love for the leader of the motorcycle gang." },

{ word: "Repercussion", meaning: "a consequence; an indirect effect", example: "One repercussion of the new tax law was that accountants found themselves with a lot of new business." },
{ word: "Replenish", meaning: "to fill again; to resupply; to restore", example: "The manager of the hardware store needed to replenish his stock; quite a few of the shelves were empty." },
{ word: "Replete", meaning: "completely filled; abounding", example: "The oncepolluted stream was now replete with fish of every description." },
{ word: "Reprehensible", meaning: "worthy of severe blame or censure", example: "He put the cat in the laundry chute, tied the dog to the chimney, and committed several other reprehensible acts." },
{ word: "Reprisal", meaning: "a military action undertaken in revenge for another; an act of taking “an eye for an eye”", example: "The raid on the Iranian oildrilling platform was a reprisal for the Iranians' earlier attack on the American tanker." },
{ word: "Reproach", meaning: "to scold, usually in disappointment; to blame; to disgrace", example: "The police officer reproached me for leaving my car parked overnight in a nostanding zone." },
{ word: "Reprove", meaning: "to criticize mildly", example: "Aunt May reproved us for eating too much, but we could tell she was actually thrilled that we had enjoyed the meal." },
{ word: "Repudiate", meaning: "to reject; to renounce; to disown; to have nothing to do with", example: "Hoping to receive a lighter sentence, the convicted gangster repudiated his former connection with the mob." },
{ word: "Requisite", meaning: "required; necessary", example: "Howard bought a hunting rifle and the requisite ammunition." },
{ word: "Resolute", meaning: "determined; firm; unwavering", example: "Uncle Ted was resolute in his decision not to have a good time at our Christmas party; he stood alone in the corner and muttered to himself all night long." },
{ word: "Respite", meaning: "a period of rest or relief", example: "We worked without respite from five in the morning until five in the afternoon." },
{ word: "Reticent", meaning: "quiet; restrained; reluctant to speak, especially about oneself", example: "Luther's natural reticence made him an ideal speaker: His speeches never lasted more than a few minutes." },
{ word: "Revere", meaning: "to respect highly; to honor", example: "Einstein was a preeminent scientist who was revered by everyone, even his rivals." },
{ word: "Rhetoric", meaning: "the art of formal speaking or writing; inflated discourse", example: "A talented public speaker might be said to be skilled in rhetoric." },
{ word: "Rigorous", meaning: "strict; harsh; severe", example: "Our exercise program was rigorous but effective; after just a few months, our eighteen hours of daily exercise had begun to pay off." },
{ word: "Robust", meaning: "strong and healthy; vigorous", example: "The hundredyearold woman was still robust." },
{ word: "Rogue", meaning: "a criminally dishonest person; a scoundrel", example: "Huckleberry Finn is a bit of a rogue; while his actions are technically criminal, he performs them with noble intentions and a humorous spirit." },

{ word: "Ruminate", meaning: "to contemplate; to ponder; to mull over", example: "The teacher's comment about the causes of weather set me to ruminating about what a nice day it was and to wishing that I were outside." },
{ word: "Rustic", meaning: "rural; lacking urban comforts or sophistication; primitive", example: "Life in the log cabin was too rustic for Leah; she missed hot showers, cold beer, and electricity." },
{ word: "Saccharine", meaning: "sweet; excessively or disgustingly sweet", example: "The love story was so saccharine that I vowed never to see another sappy, predictable movie again." },
{ word: "Sacrilege", meaning: "a violation of something sacred; blasphemy", example: "The minister committed the sacrilege of delivering his sermon while wearing his golf shoes; he didn’t want to be late for his teeoff time, which was just a few minutes after the scheduled end of the service." },
{ word: "Sacrosanct", meaning: "sacred; held to be inviolable", example: "Mr. Peters’s lunchtime trip to his neighborhood bar was sacrosanct; he would no sooner skip it than he would skip his mother ’s funeral." },
{ word: "Sagacious", meaning: "discerning; shrewd; keen in judgment; wise", example: "Edgar ’s decision to move the chickens into the barn turned out to be sagacious; about an hour later, the hailstorm hit." },
{ word: "Salient", meaning: "sticking out; conspicuous; leaping", example: "Ursula had a number of salient features including, primarily, her nose, which stuck out so far that she was constantly in danger of slamming it in doors and windows." },
{ word: "Salutary", meaning: "healthful; remedial; curative", example: "Lowered blood pressure is among the salutary effects of exercise." },
{ word: "Sanctimonious", meaning: "pretending to be devout; affecting religious feeling", example: "The sanctimonious old bore pretended to be deeply offended when Lucius whispered a mild swearword after dropping the anvil on his bare foot." },
{ word: "Sanguine", meaning: "cheerful; optimistic; hopeful", example: "Miguel was sanguine about his chances of winning the Nobel Peace Prize, even though, as an eighth grader, he hadn’t really done anything to deserve it." },
{ word: "Sardonic", meaning: "mocking; scornful", example: "Isabella’s weak attempts at humor were met by nothing but a few scattered pockets of sardonic laughter." },
{ word: "Scintillate", meaning: "to sparkle, either literally or figuratively", example: "Stefan was a quiet drudge at home, but at a party he could be absolutely scintillating, tossing off witty remarks and charming everyone in the room." },
{ word: "Scrupulous", meaning: "strict; careful; hesitant for ethical reasons", example: "Leela was scrupulous in keeping her accounts; she knew where every penny came from and where every penny went." },
{ word: "Scrutinize", meaning: "to examine very carefully", example: "I scrutinized the card catalog at the library but couldn’t find a single book on the topic I had chosen for my term paper." },
{ word: "Secular", meaning: "having nothing to do with religion or spiritual concerns", example: "The group home had several nuns on its staff, but it was an entirely secular operation; it was run by the city, not the church." },
{ word: "Sedition", meaning: "treason; the incitement of public disorder or rebellion", example: "The political group was charged with sedition because it had advocated burning the capital to the ground." },
{ word: "Segregate", meaning: "to separate", example: "Rico kept his prizewinning poodle, Fluffy, segregated from males until her thirtieth birthday." },
{ word: "Sensory", meaning: "having to do with the senses or sensation", example: "Babies enjoy bright colors, moving objects, pleasant sounds, and other forms of sensory stimulation." },

{ word: "Sequester", meaning: "to set or keep apart", example: "Since much of the rest of the city had become a battle zone, the visiting entertainers were sequestered in the international hotel." },
{ word: "Serendipity", meaning: "accidental good fortune; discovering good things without looking for them", example: "It was serendipity rather than genius that led the archaeologist to his breathtaking discovery of the ancient civilization." },
{ word: "Servile", meaning: "submissive and subservient; like a servant", example: "Cat lovers sometimes say that dogs are too servile; they follow their owners everywhere and slobber all over them at every opportunity." },
{ word: "Singular", meaning: "unique; superior; exceptional; strange", example: "Darren had the singular ability to stand on one big toe for several hours at a time." },
{ word: "Sinister", meaning: "evil, wicked; foreshadowing evil, trouble, or wickedness", example: "The house on the hill is pretty by day, but at night it casts sinister shadows and emits frightening moans." },
{ word: "Slander", meaning: "to speak badly about someone publicly; to defame; to spread malicious rumor", example: "Jonathan slandered Mr. Perriwinkle by telling everyone in school that the principal was a thief; Mr. Perriwinkle resented this slander." },
{ word: "Sloth", meaning: "laziness; sluggishness", example: "Yusuke’s weekends were devoted to sloth. He never arose before noon, and he seldom left the house before Monday morning." },
{ word: "Sobriety", meaning: "the state of being sober; seriousness", example: "Sobriety was such an unfamiliar condition that the reforming alcoholic didn’t recognize it at first." },
{ word: "Solicitous", meaning: "eager and attentive, often to the point of hovering; anxiously caring or attentive", example: "Every time we turned around, we seemed to step on the foot of the solicitous salesman, who appeared to feel that if he left us alone for more than a few seconds, we would decide to leave the store." },
{ word: "Solvent", meaning: "not broke or bankrupt; able to pay one’s bills", example: "Jerry didn’t hope to become a millionaire; all he wanted to do was remain solvent." },
{ word: "Soporific", meaning: "sleep inducing; boring; sleepy", example: "The doctor calmed his hysterical patient by injecting him with some sort of soporific medication." },
{ word: "Sordid", meaning: "vile; filthy; squalid", example: "The college roommates led a sordid existence, surrounded by dirty laundry, rotting garbage, and body odor." },
{ word: "Spawn", meaning: "to bring forth; to produce a large number", example: "A bestselling book or blockbuster movie will spawn dozens of imitators." },
{ word: "Specious", meaning: "deceptively plausible or attractive", example: "The charlatan’s specious theories about curing baldness with used tea bags charmed the studio audience but did not convince the experts, who believed that fresh tea bags were more effective." },
{ word: "Sporadic", meaning: "stopping and starting; scattered; occurring in bursts every once in a while", example: "Kyle’s attention to his schoolwork was sporadic at best; he tended to lose his concentration after a few minutes of effort." },
{ word: "Spurious", meaning: "false; fake", example: "The political candidate attributed his loss to numerous spurious rumors that had hounded him throughout his campaign." },
{ word: "Squalor", meaning: "filth; wretched, degraded, or repulsive living conditions", example: "If people live in squalor for too long, the ruling elite can count on an insurgency." },
{ word: "Squander", meaning: "to waste", example: "Jerry failed to husband his inheritance; instead, he squandered it on stuffed toys." },
{ word: "Stagnation", meaning: "motionlessness; inactivity", example: "The company grew quickly for several years, then fell into stagnation." },
{ word: "Static", meaning: "stationary; not changing or moving", example: "Sales of the new book soared for a few weeks then became static." },
{ word: "Staunch", meaning: "firmly committed; firmly in favor of; steadfast", example: "A staunch Republican is someone who always votes for Republican candidates." },
{ word: "Steadfast", meaning: "loyal; faithful", example: "Steadfast love is love that never wavers." },
{ word: "Stigmatize", meaning: "to brand with disgrace; to set a mark of disgrace upon", example: "Steve’s jeans were Lee’s instead of Levi’s, and this mistake stigmatized him for the rest of his high school career." },
{ word: "Stipulate", meaning: "to require something as part of an agreement", example: "You are well advised to stipulate the maximum amount you will pay in any carrepair contract." },
{ word: "Stoic", meaning: "indifferent (at least outwardly) to pleasure or pain, to joy or grief, to fortune or misfortune", example: "Nina was stoic about the death of her canary; she went about her business as though nothing sad had happened." },
{ word: "Stratum", meaning: "a layer; a level", example: "The middle class is one stratum of society." },
{ word: "Stricture", meaning: "a restriction; a limitation; a negative criticism", example: "Despite the strictures of apartment living, we enjoyed the eight years we spent in New York City." },
{ word: "Strife", meaning: "bitter conflict; discord; a struggle or clash", example: "Marital strife often leads to divorce." },
{ word: "Stringent", meaning: "strict; restrictive", example: "The restaurant’s stringent dress code required diners to wear paper hats, army boots, and batteryoperated twirling bow ties." },
{ word: "Stymie", meaning: "to thwart; to get in the way of; to hinder", example: "In my effort to make a name for myself in the company, I was stymied by my boss, who always managed to take credit for all the good things I did and to blame me for his mistakes." },
{ word: "Subjugate", meaning: "to subdue and dominate; to enslave", example: "I bought the fancy riding lawn mower because I thought it would make my life easier, but it quickly subjugated me; all summer long, it seems, I did nothing but change its oil, sharpen its blades, and drive it back and forth between my house and the repair shop." },
{ word: "Sublime", meaning: "awesome; extremely exalted; lofty; majestic", example: "After winning \$70 million in the lottery and quitting our jobs as sewer workers, our happiness was sublime." },
{ word: "Subordinate", meaning: "lower in importance, position, or rank; secondary", example: "My desire to sit on the couch and watch television all night long was subordinate to my desire to stand in the kitchen eating junk food all night long, so I did the latter instead of the former." },
{ word: "Substantive", meaning: "having substance; real; essential; solid; substantial", example: "The differences between the two theories were not substantive; in fact, the two theories said the same thing with different words." },
{ word: "Subtle", meaning: "not obvious; able to make fine distinctions; ingenious; crafty", example: "The alien beings had created a shrewd replica of Mr. Jenson, but his wife did notice a few subtle differences, including the fact that the new Mr. Jenson had no pulse." },
{ word: "Subversive", meaning: "corrupting; overthrowing; undermining; insurgent", example: "The political group destroyed the Pentagon’s computer files, hijacked Air Force One, and engaged in various other subversive activities." },
{ word: "Succinct", meaning: "brief and to the point; concise", example: "Aaron’s succinct explanation of why the moon doesn’t fall out of the sky and crash into the earth quickly satisfied even the dullest of the anxious investment bankers." },
{ word: "Succumb", meaning: "to yield or submit; to die", example: "I had said I wasn’t going to eat anything at the party, but when Ann held the tray of imported chocolates under my nose, I quickly succumbed and ate all of them." },
{ word: "Supercilious", meaning: "haughty; patronizing", example: "The supercilious RollsRoyce salesman treated us like peasants until we opened our suitcase full of onehundreddollar bills." },
{ word: "Superficial", meaning: "on the surface only; shallow; not thorough", example: "Tom had indeed been shot, but the wound was superficial; the bullet had merely creased the tip of his nose." },
{ word: "Superfluous", meaning: "extra; unnecessary; redundant", example: "Andrew’s attempt to repair the light bulb was superfluous, since the light bulb had already been repaired." },
{ word: "Surfeit", meaning: "excess; an excessive amount; excess or overindulgence in eating or drinking", example: "Thanksgiving meals are usually a surfeit for everyone involved." },
{ word: "Surreptitious", meaning: "sneaky; secret", example: "The dinner guest surreptitiously slipped a few silver spoons into his jacket as he was leaving the dining room." },
{ word: "Surrogate", meaning: "substitute", example: "A kind parent offered to go to prison as a surrogate for his son, who had been convicted of extortion." },
{ word: "Sycophant", meaning: "one who sucks up to others", example: "The French class seemed to be full of sycophants; the students were always bringing apples to the teacher and telling her how nice she looked." },
{ word: "Synthesis", meaning: "the combining of parts to form a whole", example: "It seemed as though the meeting might end in acrimony and confusion until Raymond offered his brilliant synthesis of the two diverging points of view." },
{ word: "Tacit", meaning: "implied; not spoken", example: "Mrs. Rodgers never formally asked us to murder her husband, but we truly believed that we were acting with her tacit consent." },
{ word: "Taciturn", meaning: "untalkative by nature", example: "The chairman was so taciturn that we often discovered that we had absolutely no idea what he was thinking." },
{ word: "Tangential", meaning: "only superficially related to the matter at hand; not especially relevant; peripheral", example: "The vice president’s speech bore only a tangential relationship to the topic that had been announced." },
{ word: "Tangible", meaning: "touchable; palpable", example: "A mountain of cigarette butts was the only tangible evidence that Luke had been in our house." },
{ word: "Tantamount", meaning: "equivalent to", example: "Waving a banner for the visiting team at that football game would be tantamount to committing suicide; the hometeam fans would tear you apart in a minute." },
{ word: "Tautological", meaning: "redundant; circular", example: "“When everyone has a camera, cameras will be universal” is a tautological statement, because “everyone having a camera” and “cameras being universal” mean the same thing." },
{ word: "Temerity", meaning: "boldness; recklessness; audacity", example: "Our waiter at the restaurant had the temerity to tell me he thought my table manners were atrocious." },
{ word: "Temperate", meaning: "mild; moderate; restrained", example: "Our climate is temperate during the spring and fall but nearly unbearable during the summer and winter." },
{ word: "Tenable", meaning: "defensible, as in one’s position in an argument; capable of being argued successfully; valid", example: "Members of the Flat Earth Society continue to argue that the earth is flat, although even children dismiss their arguments as untenable." },
{ word: "Tenacious", meaning: "persistent; stubborn; not letting go", example: "The foreign student’s tenacious effort to learn English won him the admiration of all the teachers at our school." },
{ word: "Tenet", meaning: "a shared principle or belief", example: "The tenets of his religion prohibited him from dancing and going to movies." },
{ word: "Tentative", meaning: "experimental; temporary; uncertain", example: "George made a tentative effort to paint his house by himself; he slapped some paint on the front door and his clothes, tipped over the bucket, and called a professional." },
{ word: "Tenuous", meaning: "flimsy; extremely thin", example: "The organization’s financial situation has always been tenuous; the balance of the checking account is usually close to zero." },
{ word: "Terse", meaning: "using no unnecessary words; succinct", example: "The new recording secretary’s minutes were so terse that they were occasionally cryptic." },
{ word: "Theology", meaning: "the study of God or religion", example: "Ralph was a paradox: He was an atheist, yet he passionately studied theology." },
{ word: "Tirade", meaning: "a prolonged, bitter speech", example: "Preston launched into a tirade against imitation cheese on the school lunch menu." },
{ word: "Torpor", meaning: "sluggishness; inactivity; apathy", example: "After consuming the guinea pig, the boa constrictor fell into a state of contented torpor that lasted several days." },
{ word: "Touchstone", meaning: "a standard; a test of authenticity or quality", example: "The size of a student’s vocabulary is a useful touchstone for judging the quality of his or her education." },
{ word: "Tout", meaning: "to praise highly; to brag publicly about", example: "Advertisements touted the chocolateflavored toothpaste as getting rid of your sweet tooth while saving your teeth." },
{ word: "Transcend", meaning: "to go beyond or above; to surpass", example: "The man who claimed to have invented a perpetual motion machine believed that he had transcended the laws of physics." },
{ word: "Transgress", meaning: "to violate (a law); to sin", example: "The other side had transgressed so many provisions of the treaty that we had no choice but to go to war." },
{ word: "Transient", meaning: "not staying for a long time; temporary", example: "The transient breeze provided some relief from the summer heat, but we were soon perspiring again." },
{ word: "Trepidation", meaning: "fear; apprehension; nervous trembling", example: "The nursery school students were filled with trepidation when they saw the other children in their class dressed in their Halloween costumes." },
{ word: "Turpitude", meaning: "shameful wickedness; depravity", example: "Paul was sacked by his boss because of a flagrant act of turpitude: He was caught stealing office supplies." },
{ word: "Ubiquitous", meaning: "being everywhere at the same time", example: "The new beer commercial was ubiquitous—it seemed to be on every television channel at once." },
{ word: "Unconscionable", meaning: "not controlled by conscience; unscrupulous", example: "Leaving a small child unattended all day long is an unconscionable act." },
{ word: "Unctuous", meaning: "oily, both literally and figuratively; insincere", example: "Salad oil is literally unctuous." },
{ word: "Uniform", meaning: "consistent; unchanging; the same for everyone", example: "Traffic laws are similar from one state to the next, but they aren’t uniform; each state has its own variations." },

  ];

  let bag = [];
  let current = null;
  let answered = false;
  let correctCount = 0;
  let wrongCount = 0;

  const wordDisplay = document.getElementById("wordDisplay");
  const optionsList = document.getElementById("options");
  const cardTag = document.getElementById("cardTag");
  const correctTally = document.getElementById("correctTally");
  const wrongTally = document.getElementById("wrongTally");
  const nextBtn = document.getElementById("nextBtn");
  const exampleSentence = document.getElementById("exampleSentence");
  const exampleText = document.getElementById("exampleText");
  const LETTERS = ["A", "B", "C", "D", "E"];

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function refillBag(){
    bag = shuffle([...WORDS]);
  }

  function pickDistractors(word, count){
    const chosen = new Set([word]);
    const result = [];
    const attemptLimit = WORDS.length * 5;
    let attempts = 0;
    while(result.length < count && attempts < attemptLimit){
      attempts++;
      const candidate = WORDS[Math.floor(Math.random() * WORDS.length)];
      if(chosen.has(candidate.word)) continue;
      chosen.add(candidate.word);
      result.push(candidate);
    }
    return result;
  }

  function nextCard(){
    if(bag.length === 0) refillBag();
    current = bag.pop();
    answered = false;
    nextBtn.hidden = true;
    render();
  }

  function render(){
    exampleSentence.classList.remove("is-visible");
    exampleText.innerHTML = "";
    cardTag.textContent = "Card " + (WORDS.length - bag.length) + " of " + WORDS.length;
    wordDisplay.textContent = current.word;

    const distractorCount = Math.min(4, WORDS.length - 1);
    const distractors = pickDistractors(current.word, distractorCount);
    const choices = shuffle([current, ...distractors]);

    optionsList.innerHTML = "";
    choices.forEach((choice, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "option";
      btn.dataset.meaning = choice.meaning;
      btn.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + choice.meaning + '</span>';
      btn.addEventListener("click", () => handleAnswer(btn, choice));
      li.appendChild(btn);
      optionsList.appendChild(li);
    });
  }

  function escapeRegExp(str){
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function highlightWord(sentence, word){
    const regex = new RegExp("\\b" + escapeRegExp(word) + "\\b", "i");
    return sentence.replace(regex, match => "<strong>" + match + "</strong>");
  }

  function handleAnswer(btn, choice){
    if(answered) return;
    answered = true;

    const allBtns = optionsList.querySelectorAll(".option");
    allBtns.forEach(b => b.disabled = true);

    if(choice.word === current.word){
      btn.classList.add("correct");
      correctCount++;
      correctTally.textContent = "+" + correctCount;
    } else {
      btn.classList.add("wrong");
      wrongCount++;
      wrongTally.textContent = "-" + wrongCount;
      allBtns.forEach(b => {
        if(b.dataset.meaning === current.meaning) b.classList.add("correct");
      });
    }

    exampleText.innerHTML = '<span class="label">In use —</span> ' + highlightWord(current.example, current.word);
    exampleSentence.classList.add("is-visible");
    nextBtn.hidden = false;
  }

  nextBtn.addEventListener("click", nextCard);

  document.addEventListener("keydown", (e) => {
    if(answered) return;
    const idx = { "1": 0, "2": 1, "3": 2, "4": 3, "5": 4 }[e.key];
    if(idx === undefined) return;
    const btn = optionsList.querySelectorAll(".option")[idx];
    if(btn) btn.click();
  });

  nextCard();
</script>
</body>
