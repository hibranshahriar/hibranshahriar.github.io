<style>

    --text-on-dark:#cfc9b8;

    --accent-correct:#5f8f6a;
    --accent-wrong:#b8503f;
    --accent-gold:#c99a3e;
    --hairline: rgba(43,32,19,.18);

  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, var(--ink-soft) 0%, var(--ink) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-on-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 20px 60px;
  }

  header{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 8vh;
  }

  .brand{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.05rem;
    letter-spacing: .02em;
    color: var(--text-on-dark);
  }

  .score{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: .85rem;
    color: var(--text-on-dark-dim);
  }

  .tally{
    display:inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: .78rem;
    font-weight: 700;
    color: #fff;
  }
  .tally-correct{ background: var(--accent-correct); }
  .tally-wrong{ background: var(--accent-wrong); }

  main{
    width:100%;
    max-width: 480px;
  }

  .card{
    background: var(--paper);
    border-radius: 5px;
    padding: 40px 36px 32px;
    box-shadow: 0 20px 44px var(--paper-shadow);
  }

  .tag{
    margin: 0 0 10px;
    font-size: .78rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .word{
    margin: 0 0 30px;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    color: var(--text-dark);
    text-transform: capitalize;
    line-height: 1.15;
  }

  .options{
    list-style:none;
    margin:0;
    padding:0;
  }

  .options li + li{
    border-top: 1px solid var(--hairline);
  }

  .option{
    width:100%;
    display:flex;
    align-items:baseline;
    gap: 14px;
    background:none;
    border:none;
    text-align:left;
    padding: 14px 6px;
    font-size: 1.02rem;
    color: var(--text-dark);
    cursor:pointer;
    border-radius: 3px;
    transition: background .15s, color .15s;
  }
  .option:hover:not(:disabled){ background: rgba(43,32,19,.06); }
  .option:focus-visible{ outline: 2px solid var(--accent-gold); outline-offset: -2px; }
  .option:disabled{ cursor: default; }

  .option .letter{
    font-family: Georgia, serif;
    font-style: italic;
    color: var(--text-muted);
    flex-shrink:0;
  }

  .option.correct{ background: var(--accent-correct); color:#fff; }
  .option.correct .letter{ color: rgba(255,255,255,.75); }
  .option.wrong{ background: var(--accent-wrong); color:#fff; text-decoration: line-through; opacity:.9; }
  .option.wrong .letter{ color: rgba(255,255,255,.75); }

  .next-btn{
    display:block;
    margin: 26px 0 0;
    background: var(--accent-gold);
    color: var(--ink);
    border:none;
    font-size: .92rem;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 3px;
    cursor:pointer;
    transition: filter .15s;
  }
  .next-btn:hover, .next-btn:focus-visible{ filter: brightness(1.08); }

  .example{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .35s ease;
    overflow: hidden;
  }
  .example.is-visible{
    grid-template-rows: 1fr;
  }
  .example-text{
    min-height: 0;
    overflow: hidden;
    margin: 22px 0 0;
    padding-top: 18px;
    border-top: 1px solid var(--hairline);
    font-size: .95rem;
    line-height: 1.55;
    color: var(--text-muted);
    font-style: italic;
  }
  .example-text .label{
    font-style: normal;
    font-weight: 600;
    color: var(--text-muted);
    margin-right: 4px;
  }
  .example-text strong{
    font-style: normal;
    font-weight: 600;
    color: #9c6f1f;
  }

  @media (max-width: 480px){
    .card{ padding: 32px 24px 26px; }
    header{ margin-bottom: 6vh; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>

{ word: "Hypothetical", meaning: "uncertain; unproven", example: "none" },
{ word: "Recalcitrant", meaning: "stubbornly defiant of authority or control", example: "none" },
{ word: "Ambulatory", meaning: "able to walk; walking", example: "none" },
{ word: "Diffident", meaning: "timid; lacking in selfconfidence", example: "none" },
{ word: "Drone", meaning: "to talk on and on in a dull way", example: "none" },
{ word: "Gullible", meaning: "overly trusting; willing to believe anything", example: "none" },
{ word: "Marred", meaning: "damaged; bruised", example: "none" },
{ word: "Nullify", meaning: "to make unimportant", example: "none" },
{ word: "Parsimony", meaning: "stinginess", example: "none" },
{ word: "Propriety", meaning: "properness; good manners", example: "none" },
{ word: "Rejuvenate", meaning: "to make young and strong again", example: "none" },
{ word: "Skeptical", meaning: "doubting (opposite of gullible)", example: "none" },
{ word: "Tenacious", meaning: "tough; hard to defeat", example: "none" },
{ word: "Animated", meaning: "alive; moving", example: "none" },
{ word: "Authentic", meaning: "real", example: "none" },
{ word: "Bias", meaning: "prejudice; tendency; tilt", example: "none" },
{ word: "Blithe", meaning: "carefree; cheerful", example: "none" },
{ word: "Dearth", meaning: "a lack of; scarcity", example: "none" },
{ word: "Divert", meaning: "to change the direction of; to alter the course of; to amuse", example: "none" },
{ word: "Enthrall", meaning: "to thrill", example: "none" },
{ word: "Heed", meaning: "to listen to", example: "none" },
{ word: "Hindrance", meaning: "an obstruction; an annoying interference or delay", example: "none" },
{ word: "Irascible", meaning: "irritable", example: "none" },
{ word: "Merger", meaning: "a joining or marriage", example: "none" },
{ word: "Nostalgia", meaning: "a sentimental longing for the past; homesickness", example: "none" },
{ word: "Pretentious", meaning: "pompous; selfimportant; ETSlike", example: "none" },
{ word: "Saccharine", meaning: "sweet; excessively or disgustingly sweet", example: "none" },
{ word: "Stanza", meaning: "a section of a poem; verse", example: "none" }
  ];

  let bag = [];
  let current = null;
  let answered = false;
  let correctCount = 0;
  let wrongCount = 0;

  const wordDisplay = document.getElementById("wordDisplay");
  const optionsList = document.getElementById("options");
  const cardTag = document.getElementById("cardTag");
  const correctTally = document.getElementById("correctTally");
  const wrongTally = document.getElementById("wrongTally");
  const nextBtn = document.getElementById("nextBtn");
  const exampleSentence = document.getElementById("exampleSentence");
  const exampleText = document.getElementById("exampleText");
  const LETTERS = ["A", "B", "C", "D", "E"];

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function refillBag(){
    bag = shuffle([...WORDS]);
  }

  function pickDistractors(word, count){
    const chosen = new Set([word]);
    const result = [];
    const attemptLimit = WORDS.length * 5;
    let attempts = 0;
    while(result.length < count && attempts < attemptLimit){
      attempts++;
      const candidate = WORDS[Math.floor(Math.random() * WORDS.length)];
      if(chosen.has(candidate.word)) continue;
      chosen.add(candidate.word);
      result.push(candidate);
    }
    return result;
  }

  function nextCard(){
    if(bag.length === 0) refillBag();
    current = bag.pop();
    answered = false;
    nextBtn.hidden = true;
    render();
  }

  function render(){
    exampleSentence.classList.remove("is-visible");
    exampleText.innerHTML = "";
    cardTag.textContent = "Card " + (WORDS.length - bag.length) + " of " + WORDS.length;
    wordDisplay.textContent = current.word;

    const distractorCount = Math.min(4, WORDS.length - 1);
    const distractors = pickDistractors(current.word, distractorCount);
    const choices = shuffle([current, ...distractors]);

    optionsList.innerHTML = "";
    choices.forEach((choice, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "option";
      btn.dataset.meaning = choice.meaning;
      btn.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + choice.meaning + '</span>';
      btn.addEventListener("click", () => handleAnswer(btn, choice));
      li.appendChild(btn);
      optionsList.appendChild(li);
    });
  }

  function escapeRegExp(str){
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function highlightWord(sentence, word){
    const regex = new RegExp("\\b" + escapeRegExp(word) + "\\b", "i");
    return sentence.replace(regex, match => "<strong>" + match + "</strong>");
  }

  function handleAnswer(btn, choice){
    if(answered) return;
    answered = true;

    const allBtns = optionsList.querySelectorAll(".option");
    allBtns.forEach(b => b.disabled = true);

    if(choice.word === current.word){
      btn.classList.add("correct");
      correctCount++;
      correctTally.textContent = "+" + correctCount;
    } else {
      btn.classList.add("wrong");
      wrongCount++;
      wrongTally.textContent = "-" + wrongCount;
      allBtns.forEach(b => {
        if(b.dataset.meaning === current.meaning) b.classList.add("correct");
      });
    }

    exampleText.innerHTML = '<span class="label">In use —</span> ' + highlightWord(current.example, current.word);
    exampleSentence.classList.add("is-visible");
    nextBtn.hidden = false;
  }

  nextBtn.addEventListener("click", nextCard);

  document.addEventListener("keydown", (e) => {
    if(answered) return;
    const idx = { "1": 0, "2": 1, "3": 2, "4": 3, "5": 4 }[e.key];
    if(idx === undefined) return;
    const btn = optionsList.querySelectorAll(".option")[idx];
    if(btn) btn.click();
  });

  nextCard();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js");
    });
  }
</script>
